# El repositorio publico es el SITIO: landing, paginas de funding, capturas y
# el QR. Ni codigo, ni specs, ni notas de desarrollo, ni evidencia del
# fabricante.
#
# Decidido por el dueno del proyecto el 2026-10-20. Este workflow es el
# mecanismo para que no se revierta por descuido: el gate corre en cada push
# al repo publico y falla si aparece material que no debe salir, si el texto
# vuelve a prometer un documento que no se publica, o si nombra el metodo de
# analisis o los simbolos internos del fabricante.
#
# La herramienta la publica el render (`tools/publica-docs.py`, en el repo de
# codigo), asi que esta siempre al dia con la de alla.
name: Exposicion del repo publico

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-exposicion:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: El repo publico solo contiene el sitio
        run: bash tools/check_public_repo.sh .

      - name: Las citas del arbol publicado no estan muertas
        run: python3 tools/check_doc_paths.py .
